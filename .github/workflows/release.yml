name: Release

# Publishes the addon to npm when a GitHub release is published, which only
# maintainers can do. Needs an NPM_TOKEN secret with publish access.
#
# To release: bump the version in packages/storybook-addon-testing-library/package.json,
# update CHANGELOG.md, then publish a GitHub release.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        working-directory: packages/storybook-addon-testing-library
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
