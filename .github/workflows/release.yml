name: Release

# Publishes the addon to npm when a merge to main changes its version to one that is not on npm yet, then tags the
# commit and creates a GitHub release. Merges that leave the version alone publish nothing.
#
# To release: bump the version in packages/storybook-addon-testing-library/package.json and update CHANGELOG.md in
# the pull request. Needs an NPM_TOKEN secret: a granular access token with publish access and "bypass 2FA" on,
# since npm refuses a publish from CI otherwise.

on:
  push:
    branches: [main]

# A second merge waits for the first release to finish, so both cannot publish the same version
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check whether the version is already on npm
        id: version
        working-directory: packages/storybook-addon-testing-library
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm, so there is nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run build
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public ${{ contains(steps.version.outputs.version, '-') && '--tag next' || '' }}
        working-directory: packages/storybook-addon-testing-library
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: steps.version.outputs.publish == 'true'
        name: Tag and create a GitHub release
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes ${{ startsWith(steps.version.outputs.version, '0.') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
